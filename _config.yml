# Site settings ---------------------------------------------------------------
title: Jezekael Brunon
description: >-
  Jezekael Brunon, offensive security consultant. A terminal-themed notebook of
  state-linked cyber operations, actor profiles, RF/SDR projects and CTF write-ups.
url: https://jezekael.github.io
baseurl: ""
tagline: Offensive security notebook
author: Jezekael Brunon
lang: en

cv_pdf: /assets/BRUNON_Jezekael_CV_ENG.pdf

# Build -------------------------------------------------------------------------
markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false
  syntax_highlighter_opts:
    disable: true

plugins:
  - jekyll-sitemap
  - jekyll-seo-tag

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
  - "Write up Hack a sat 2020 - AAA & space cadet"

# Content folders ---------------------------------------------------------------
# Every .md file in blog/ and projects/ becomes a page whose URL mirrors its location:
#   projects/writeups/hack_a_sat/2020/aaaa.md -> /projects/writeups/hack_a_sat/2020/aaaa.html
# A folder's index.md (layout: folder) becomes the folder page and lists everything inside it.

# Front-matter defaults, so each file only needs title/date/description/tags.
defaults:
  - scope: { path: "" }
    values: { layout: default }
  - scope: { path: "blog" }
    values: { layout: article, kind: blog }
  - scope: { path: "projects" }
    values: { layout: article, kind: project }
  - scope: { path: "projects/writeups" }
    values: { kind: writeup }
  - scope: { path: "projects/wwta/incidents" }
    values: { layout: incident, in_feed: false }
  - scope: { path: "projects/wwta/groups" }
    values: { layout: group, in_feed: false }
