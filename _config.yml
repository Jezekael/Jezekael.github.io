# Site settings ---------------------------------------------------------------
title: Jezekael Brunon
description: >-
  Jezekael Brunon, offensive security consultant. A terminal-themed notebook of
  state-linked cyber operations, actor profiles, RF/SDR projects and CTF write-ups.
url: https://jezekael.github.io
baseurl: ""
tagline: Offensive security notebook
author: Jezekael Brunon
lang: en

cv_pdf: /assets/BRUNON_Jezekael_CV_ENG.pdf

# Build -------------------------------------------------------------------------
markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false
  syntax_highlighter_opts:
    disable: true

plugins:
  - jekyll-redirect-from
  - jekyll-sitemap
  - jekyll-seo-tag

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
  - "Write up Hack a sat 2020 - AAA & space cadet"

# Content folders ---------------------------------------------------------------
# Every file in these folders becomes a page. Its URL mirrors its location:
#   _projects/writeups/hack_a_sat/2020/aaaa.md -> /projects/writeups/hack_a_sat/2020/aaaa.html
# A folder's index.md becomes the folder page and lists everything inside it.
collections:
  blog:
    output: true
    permalink: /blog/:path:output_ext
  notes:
    output: true
    permalink: /notes/:path:output_ext
  projects:
    output: true
    permalink: /projects/:path:output_ext

# Front-matter defaults, so each file only needs title/date/summary/tags.
defaults:
  - scope: { path: "" }
    values: { layout: default }
  - scope: { path: "", type: blog }
    values: { layout: article, kind: blog, eyebrow: Blog }
  - scope: { path: "", type: notes }
    values: { layout: article, kind: note, eyebrow: Note }
  - scope: { path: "", type: projects }
    values: { layout: article, kind: project, eyebrow: Project }
  - scope: { path: "_projects/writeups", type: projects }
    values: { kind: writeup, eyebrow: Write-up }
  - scope: { path: "_projects/wwta/incidents", type: projects }
    values: { layout: incident, in_feed: false }
  - scope: { path: "_projects/wwta/groups", type: projects }
    values: { layout: group, in_feed: false }
