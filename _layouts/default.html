<!DOCTYPE html>
<html lang="{{ site.lang | default: 'en' }}" data-baseurl="{{ site.baseurl }}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0d0d0d">
  {% seo %}
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
  {%- if page.leaflet %}
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
  {%- endif %}
</head>
<body>
{% include header.html %}
{{ content }}
{% include footer.html %}
{%- if page.leaflet %}
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
{%- endif %}
<script src="{{ '/assets/js/common.js' | relative_url }}"></script>
{%- for script in page.scripts %}
<script src="{{ script | prepend: '/assets/js/' | relative_url }}"></script>
{%- endfor %}
{%- if page.mermaid %}
<script type="module">
  import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs';
  // Turn ```mermaid code blocks into diagrams.
  document.querySelectorAll('code.language-mermaid, .language-mermaid code').forEach((code) => {
    const box = code.closest('div.language-mermaid') || code.closest('pre');
    const div = document.createElement('div');
    div.className = 'mermaid';
    div.textContent = code.textContent;
    box.replaceWith(div);
  });
  mermaid.initialize({ startOnLoad: false, theme: 'dark' });
  await mermaid.run();
</script>
{%- endif %}
</body>
</html>
